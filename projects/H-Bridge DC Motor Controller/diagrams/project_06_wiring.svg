<svg width="680" viewBox="0 0 680 490" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Project 06 — H-Bridge DC Motor Controller Wiring Diagram</title>
<desc>L298N H-bridge module between Arduino Mega and DC motor. ENA/IN1/IN2 from pins 9/7/8. OUT1/OUT2 drive motor. 1 ohm sense resistor on motor ground path read by A0.</desc>

<rect width="680" height="490" fill="#ffffff"/>

<!-- Background rectangle -->
<rect width="100%" height="100%" style="fill:rgb(54, 54, 54)" />

<!-- GND rail -->
<line x1="155" y1="448" x2="515" y2="448" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="308" y1="452" x2="332" y2="452" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>
<line x1="313" y1="458" x2="327" y2="458" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>
<line x1="317" y1="464" x2="323" y2="464" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>
<text font-family="sans-serif" font-size="12" fill="rgb(250, 249, 245)" text-anchor="middle" x="320" y="478">GND</text>
<circle cx="155" cy="448" r="3.5" fill="rgb(250, 249, 245)"/>
<circle cx="295" cy="448" r="3.5" fill="rgb(250, 249, 245)"/>

<!-- External supply block -->
<rect x="250" y="18" width="110" height="52" rx="8" fill="#888888" stroke="#f5f5f5" stroke-width="1"/>
<text font-family="sans-serif" font-size="13" font-weight="500" fill="#f5f5f5" text-anchor="middle" x="305" y="40">5–9V supply</text>
<text font-family="sans-serif" font-size="11" fill="#f5f5f5" text-anchor="middle" x="305" y="56">motor power</text>

<!-- Supply +V wire -->
<path d="M305 70 L295 70 L295 90" fill="none" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>
<!-- Supply GND wire -->
<path d="M250 44 L155 44 L155 448" fill="none" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>

<!-- L298N block -->
<rect x="195" y="90" width="200" height="260" rx="8" fill="#d97706" stroke="#fef3c7" stroke-width="1"/>
<text font-family="sans-serif" font-size="14" font-weight="500" fill="#fef3c7" text-anchor="middle" x="295" y="280">L298N</text>
<text font-family="sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle" x="295" y="298">H-Bridge module</text>

<!-- L298N pin labels -->
<text font-family="sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle" x="295" y="107">VS ↑</text>
<text font-family="sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle" x="295" y="342">GND ↓</text>
<text font-family="sans-serif" font-size="11" fill="#fef3c7" text-anchor="end" x="388" y="120">VSS</text>
<text font-family="sans-serif" font-size="11" fill="#fef3c7" text-anchor="end" x="388" y="165">ENA</text>
<text font-family="sans-serif" font-size="11" fill="#fef3c7" text-anchor="end" x="388" y="200">IN1</text>
<text font-family="sans-serif" font-size="11" fill="#fef3c7" text-anchor="end" x="388" y="235">IN2</text>
<text font-family="sans-serif" font-size="11" fill="#fef3c7" text-anchor="start" x="202" y="210">OUT1</text>
<text font-family="sans-serif" font-size="11" fill="#fef3c7" text-anchor="start" x="202" y="250">OUT2</text>
<circle cx="395" cy="120" r="3" fill="rgb(250, 249, 245)"/>
<circle cx="395" cy="165" r="3" fill="rgb(250, 249, 245)"/>
<circle cx="395" cy="200" r="3" fill="rgb(250, 249, 245)"/>
<circle cx="395" cy="235" r="3" fill="rgb(250, 249, 245)"/>
<circle cx="195" cy="210" r="3" fill="rgb(250, 249, 245)"/>
<circle cx="195" cy="250" r="3" fill="rgb(250, 249, 245)"/>

<!-- DC Motor block -->
<rect x="25" y="190" width="100" height="80" rx="8" fill="#0d9488" stroke="#e6f9f5" stroke-width="1"/>
<text font-family="sans-serif" font-size="13" font-weight="500" fill="#e6f9f5" text-anchor="middle" x="75" y="226">DC Motor</text>
<text font-family="sans-serif" font-size="11" fill="#e6f9f5" text-anchor="middle" x="75" y="244">3–6V</text>
<circle cx="125" cy="210" r="3" fill="rgb(250, 249, 245)"/>
<circle cx="125" cy="250" r="3" fill="rgb(250, 249, 245)"/>
<text font-family="sans-serif" font-size="11" fill="#e6f9f5" x="130" y="208">A</text>
<text font-family="sans-serif" font-size="11" fill="#e6f9f5" x="130" y="248">B</text>

<!-- Arduino block -->
<rect x="500" y="45" width="150" height="410" rx="8" fill="#185fa5" stroke="#e6f1fb" stroke-width="1"/>
<text font-family="sans-serif" font-size="14" font-weight="500" fill="#e6f1fb" text-anchor="middle" x="575" y="72">Arduino Mega</text>
<text font-family="sans-serif" font-size="11" fill="#e6f1fb" x="512" y="120">5V</text>
<text font-family="sans-serif" font-size="11" fill="#e6f1fb" x="512" y="165">PWM ~9</text>
<text font-family="sans-serif" font-size="11" fill="#e6f1fb" x="512" y="200">D7</text>
<text font-family="sans-serif" font-size="11" fill="#e6f1fb" x="512" y="235">D8</text>
<text font-family="sans-serif" font-size="11" fill="#e6f1fb" x="512" y="420">A0</text>
<text font-family="sans-serif" font-size="11" fill="#e6f1fb" x="512" y="445">GND</text>
<circle cx="500" cy="120" r="3" fill="rgb(250, 249, 245)"/>
<circle cx="500" cy="165" r="3" fill="rgb(250, 249, 245)"/>
<circle cx="500" cy="200" r="3" fill="rgb(250, 249, 245)"/>
<circle cx="500" cy="235" r="3" fill="rgb(250, 249, 245)"/>
<circle cx="500" cy="420" r="3" fill="rgb(250, 249, 245)"/>
<circle cx="500" cy="448" r="3" fill="rgb(250, 249, 245)"/>

<!-- Wires: Arduino to L298N right side -->
<line x1="498" y1="120" x2="397" y2="120" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>
<line x1="498" y1="165" x2="397" y2="165" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>
<line x1="498" y1="200" x2="397" y2="200" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>
<line x1="498" y1="235" x2="397" y2="235" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>

<!-- Wires: L298N left side to Motor -->
<line x1="193" y1="210" x2="127" y2="210" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>
<line x1="193" y1="250" x2="127" y2="250" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>

<!-- L298N GND to Node C -->
<line x1="295" y1="350" x2="295" y2="375" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>

<!-- Node C to Sense Resistor -->
<line x1="295" y1="375" x2="295" y2="400" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>

<!-- Sense resistor -->
<rect x="288" y="400" width="14" height="30" rx="3" fill="#f0f0f0" stroke="#888888" stroke-width="0.75"/>
<text font-family="sans-serif" font-size="11" fill="rgb(250, 249, 245)" text-anchor="end" x="285" y="415">1Ω</text>
<text font-family="sans-serif" font-size="11" fill="rgb(250, 249, 245)" text-anchor="end" x="285" y="425">R_sense</text>

<!-- Low-pass filter -->
<line x1="295" y1="375" x2="335" y2="375" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>
<line x1="335" y1="375" x2="335" y2="380" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>
	<!-- Resistor -->
<rect x="328" y="380" width="14" height="30" rx="3" fill="#f0f0f0" stroke="#888888" stroke-width="0.75"/>
<line x1="335" y1="410" x2="335" y2="430" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>
<text font-family="sans-serif" font-size="11" fill="rgb(250, 249, 245)" text-anchor="end" x="325" y="390">1kΩ</text>
	<!-- Capacitor -->
<line x1="325" y1="430" x2="345" y2="430" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<path d="M325 435 Q335 440 345 435" fill="none" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="335" y1="439" x2="335" y2="447" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>
<text font-family="sans-serif" font-size="11" fill="rgb(250, 249, 245)" text-anchor="end" x="324" y="438">10µF</text>

<!-- Sense resistor bottom to GND rail -->
<line x1="295" y1="430" x2="295" y2="448" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>


<!-- A0 wire -->
<circle cx="335" cy="420" r="3.5" fill="rgb(250, 249, 245)"/>
<line x1="498" y1="420" x2="335" y2="420" stroke="rgb(250, 249, 245)" stroke-width="1.5"/>

<!-- Node C junction -->
<circle cx="295" cy="375" r="4.5" fill="rgb(250, 249, 245)"/>
<text font-family="sans-serif" font-size="11" fill="rgb(250, 249, 245)" text-anchor="end" x="288" y="366">Node C</text>

<!-- Annotation -->
<text font-family="sans-serif" font-size="11" fill="#aaaaaa" text-anchor="middle" x="430" y="412">← A0 reads I × R_sense</text>

</svg>
