<svg width="1000" viewBox="80 0 800 550" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Oscilloscope Op-amp Wiring Diagram</title>

<!-- Background rectangle -->
<rect width="100%" height="100%" style="fill:rgb(54, 54, 54)" />

<!-- NE555 -->
<rect x="350" y="150" width="200" height="250" rx="3" fill="#f5c7a9" stroke="#010101" stroke-width="1"/>
<text font-family="sans-serif" font-size="20" font-weight="750" fill="#010101" text-anchor="middle" x="450" y="275">NE555</text>
<text font-family="sans-serif" font-size="18" font-weight="500" fill="#010101" text-anchor="middle" x="420" y="170">4</text>
<text font-family="sans-serif" font-size="18" font-weight="500" fill="#010101" text-anchor="middle" x="480" y="170">8</text>
<text font-family="sans-serif" font-size="18" font-weight="500" fill="#010101" text-anchor="middle" x="420" y="385">2</text>
<text font-family="sans-serif" font-size="18" font-weight="500" fill="#010101" text-anchor="middle" x="480" y="385">1</text>
<text font-family="sans-serif" font-size="18" font-weight="500" fill="#010101" text-anchor="middle" x="360" y="225">7</text>
<text font-family="sans-serif" font-size="18" font-weight="500" fill="#010101" text-anchor="middle" x="360" y="330">6</text>
<text font-family="sans-serif" font-size="18" font-weight="500" fill="#010101" text-anchor="middle" x="540" y="225">3</text>
<text font-family="sans-serif" font-size="18" font-weight="500" fill="#010101" text-anchor="middle" x="540" y="330">5</text>

<!-- Power Rail -->
<text font-family="sans-serif" font-size="15" font-weight="500" fill="rgb(250, 249, 245)" text-anchor="middle" x="480" y="40">Vcc</text>
<line x1="470" y1="50" x2="490" y2="50" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="480" y1="50" x2="480" y2="150" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="420" y1="100" x2="420" y2="150" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="140" y1="100" x2="480" y2="100" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="140" y1="100" x2="140" y2="150" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="240" y1="100" x2="240" y2="150" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<circle cx="240" cy="100" r="3" fill="rgb(250, 249, 245)"/>
<circle cx="480" cy="100" r="3" fill="rgb(250, 249, 245)"/>
<circle cx="420" cy="100" r="3" fill="rgb(250, 249, 245)"/>

<!-- Trigger Rail -->

<!-- Pullup Resistor -->
<rect x="130" y="150" width="20" height="60" fill="#634025" stroke="#361f0d" stroke-width="1"/>
<text font-family="sans-serif" font-size="15" font-weight="500" fill="rgb(250, 249, 245)" text-anchor="middle" x="170" y="170">10kΩ</text>

<!-- Switch -->
<line x1="140" y1="210" x2="140" y2="280" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<circle cx="140" cy="280" r="3" stroke="rgb(250, 249, 245)"/>
<circle cx="140" cy="320" r="3" stroke="rgb(250, 249, 245)"/>
<line x1="140" y1="320" x2="140" y2="445" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="125" y1="285" x2="140" y2="320" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<circle cx="140" cy="320" r="3" stroke="rgb(250, 249, 245)"/>

<!-- Line to pin 2 -->
<line x1="140" y1="250" x2="180" y2="250" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="180" y1="250" x2="180" y2="420" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="180" y1="420" x2="420" y2="420" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="420" y1="400" x2="420" y2="420" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<circle cx="140" cy="250" r="3" fill="rgb(250, 249, 245)"/>


<!-- RC rail -->

<!-- Resistor -->
<rect x="230" y="150" width="20" height="60" fill="#634025" stroke="#361f0d" stroke-width="1"/>
<text font-family="sans-serif" font-size="15" font-weight="500" fill="rgb(250, 249, 245)" text-anchor="middle" x="280" y="170">45.5kΩ</text>

<!-- Segment between R and C -->
<line x1="240" y1="220" x2="350" y2="220" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="240" y1="325" x2="350" y2="325" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="240" y1="220" x2="350" y2="220" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="240" y1="210" x2="240" y2="370" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<circle cx="240" cy="325" r="3" fill="rgb(250, 249, 245)"/>
<circle cx="240" cy="220" r="3" fill="rgb(250, 249, 245)"/>

<!-- Capacitor -->
<line x1="225" y1="370" x2="255" y2="370" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<path d="M225 380 Q240 375 255 380" fill="none" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="240" y1="375" x2="240" y2="445" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<text font-family="sans-serif" font-size="15" font-weight="500" fill="rgb(250, 249, 245)" text-anchor="middle" x="280" y="370">100µF</text>

<!-- Pin 5 to GND -->
<line x1="550" y1="325" x2="620" y2="325" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="620" y1="325" x2="620" y2="360" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="605" y1="360" x2="635" y2="360" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="605" y1="367" x2="635" y2="367" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="620" y1="367" x2="620" y2="445" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<text font-family="sans-serif" font-size="15" font-weight="500" fill="rgb(250, 249, 245)" text-anchor="middle" x="585" y="367">10nF</text>

<!-- Pin 3 to LED -->
<line x1="550" y1="218" x2="680" y2="218" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="680" y1="218" x2="680" y2="250" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<rect x="670" y="250" width="20" height="60" fill="#634025" stroke="#361f0d" stroke-width="1"/>
<text font-family="sans-serif" font-size="15" font-weight="500" fill="rgb(250, 249, 245)" text-anchor="middle" x="715" y="270">470Ω</text>
<line x1="680" y1="310" x2="680" y2="350" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<polygon points="670,350 690,350 680,365" fill="#9e1a0b" stroke="#7d1409" stroke-width="1"/>
<line x1="670" y1="365" x2="690" y2="365" stroke="#9e1a0b" stroke-width="2"/>
<line x1="680" y1="365" x2="680" y2="445" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="690" y1="355" x2="695" y2="360" stroke="#9e1a0b" stroke-width="2"/>
<line x1="688" y1="360" x2="693" y2="365" stroke="#9e1a0b" stroke-width="2"/>

<!-- GND Rail -->
<line x1="480" y1="400" x2="480" y2="445" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="140" y1="445" x2="680" y2="445" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<circle cx="240" cy="445" r="3" fill="rgb(250, 249, 245)"/>
<circle cx="480" cy="445" r="3" fill="rgb(250, 249, 245)"/>
<circle cx="620" cy="445" r="3" fill="rgb(250, 249, 245)"/>
<line x1="480" y1="445" x2="480" y2="460" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="470" y1="460" x2="490" y2="460" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="473" y1="465" x2="487" y2="465" stroke="rgb(250, 249, 245)" stroke-width="2"/>
<line x1="476" y1="470" x2="484" y2="470" stroke="rgb(250, 249, 245)" stroke-width="2"/>

</svg>